name: Deploy Liveraiz3D Viewer

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: liveraiz3d-viewer-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: liveraiz3d-viewer
  CLOUDFRONT_DISTRIBUTION_ID: E1BIM25RUNKDC8

jobs:
  deploy:
    name: Build and deploy viewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build viewer
        run: npm run build

      - name: Verify build output
        run: |
          test -f build/index.html
          test -d build/assets
          echo "Viewer build verified"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009152046804:role/LiveraizGithubActionsAwsDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: liveraiz3d-viewer-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload viewer files
        run: |
          aws s3 sync build/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "index.html"

      - name: Upload index.html
        run: |
          aws s3 cp build/index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "### Liveraiz3D Viewer deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://viewer.liveraiz.net" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3: ${S3_BUCKET}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CloudFront: ${CLOUDFRONT_DISTRIBUTION_ID}" >> "$GITHUB_STEP_SUMMARY"
