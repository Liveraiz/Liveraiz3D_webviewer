<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XR Viewer - LiverAIz3D</title>
    <meta name="xr-supported" content="true">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        #xr-container {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px 50px;
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
            font-size: 18px;
            display: none;
            max-width: 500px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 500;
            display: none;
        }

        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="xr-container"></div>
    <div id="loading">
        <div>XR 환경 로딩 중...</div>
        <div class="spinner"></div>
    </div>
    <div id="error-message"></div>
    <div id="controls">
        <button id="exit-xr-button">XR 종료</button>
    </div>

    <script type="module">
        // XR Viewer - 웹 네이티브 스크립트 (바로 작성)
        
        class XRViewer {
            constructor() {
                this.container = document.getElementById('xr-container');
                this.loadingElement = document.getElementById('loading');
                this.errorElement = document.getElementById('error-message');
                this.controlsElement = document.getElementById('controls');
                
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.xrSession = null;
                this.modelData = null;
                
                this.initialize();
            }

            initialize() {
                try {
                    // URL 파라미터에서 모델 데이터 추출
                    const urlParams = new URLSearchParams(window.location.search);
                    const modelDataStr = urlParams.get('modelData');
                    
                    if (modelDataStr) {
                        this.modelData = JSON.parse(decodeURIComponent(modelDataStr));
                        console.log('Model data loaded:', this.modelData);
                    }

                    this.checkXRSupport();
                } catch (error) {
                    console.error('Initialization error:', error);
                    this.showError('초기화 중 오류가 발생했습니다: ' + error.message);
                }
            }

            checkXRSupport() {
                if (!('xr' in navigator)) {
                    this.showError('이 브라우저는 WebXR를 지원하지 않습니다.');
                    return;
                }

                // AR 지원 확인
                navigator.xr.isSessionSupported('immersive-ar')
                    .then(supported => {
                        if (supported) {
                            console.log('AR is supported');
                            this.setupARSession();
                        } else {
                            console.log('AR is not supported, trying VR...');
                            return navigator.xr.isSessionSupported('immersive-vr');
                        }
                    })
                    .then(supported => {
                        if (supported) {
                            console.log('VR is supported');
                            this.setupVRSession();
                        } else {
                            this.showError('이 디바이스는 AR/VR을 지원하지 않습니다.');
                        }
                    })
                    .catch(error => {
                        console.error('Error checking XR support:', error);
                        this.showError('XR 지원 확인 중 오류: ' + error.message);
                    });
            }

            setupARSession() {
                console.log('Setting up AR session...');
                const sessionInit = {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['dom-overlay', 'dom-overlay-for-handheld-ar'],
                    domOverlay: { root: document.body }
                };

                navigator.xr.requestSession('immersive-ar', sessionInit)
                    .then(session => this.onSessionStart(session))
                    .catch(error => {
                        console.error('AR session request error:', error);
                        this.showError('AR 세션을 시작할 수 없습니다: ' + error.message);
                    });
            }

            setupVRSession() {
                console.log('Setting up VR session...');
                const sessionInit = {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: []
                };

                navigator.xr.requestSession('immersive-vr', sessionInit)
                    .then(session => this.onSessionStart(session))
                    .catch(error => {
                        console.error('VR session request error:', error);
                        this.showError('VR 세션을 시작할 수 없습니다: ' + error.message);
                    });
            }

            onSessionStart(session) {
                console.log('XR Session started:', session);
                this.xrSession = session;
                this.loadingElement.style.display = 'none';
                this.controlsElement.style.display = 'block';

                // Exit 버튼 이벤트
                document.getElementById('exit-xr-button').addEventListener('click', () => {
                    this.exitXR();
                });

                // XR 기본 설정
                console.log('XR session mode:', this.xrSession.mode);
                console.log('Model data:', this.modelData);

                // 여기서 Three.js를 이용해 렌더링할 수 있습니다
                // 현재는 세션 시작만 구현
            }

            exitXR() {
                if (this.xrSession) {
                    this.xrSession.end()
                        .then(() => {
                            console.log('XR session ended');
                            window.close();
                        })
                        .catch(error => {
                            console.error('Error ending XR session:', error);
                            window.close();
                        });
                }
            }

            showError(message) {
                console.error(message);
                this.errorElement.textContent = message;
                this.errorElement.style.display = 'block';
                this.loadingElement.style.display = 'none';
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            new XRViewer();
        });
    </script>
</body>
</html>
